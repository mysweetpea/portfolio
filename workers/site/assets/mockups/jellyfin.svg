<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#132026"/><stop offset="1" stop-color="#0C1316"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1B2B31"/><stop offset="1" stop-color="#142127"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5EB8A8"/><stop offset="1" stop-color="#3E8E86"/></linearGradient>
  </defs>
  <rect width="400" height="260" rx="16" fill="url(#bg)"/>
  <rect x="20" y="16" width="360" height="228" rx="12" fill="url(#card)" stroke="#2A3B42" stroke-width="1"/>
  <circle cx="36" cy="30" r="4" fill="#D98C8C"/><circle cx="50" cy="30" r="4" fill="#D9A86C"/><circle cx="64" cy="30" r="4" fill="#5ED39E"/>
  <!-- video player -->
  <rect x="20" y="44" width="360" height="200" fill="#0F1A1E"/>
  <rect x="20" y="44" width="360" height="150" fill="#1B2B31"/>
  <circle cx="200" cy="119" r="24" fill="url(#accent)" opacity=".9"/>
  <path d="M194 108l20 11-20 11z" fill="#0C1316"/>
  <!-- progress bar -->
  <rect x="40" y="200" width="320" height="4" rx="2" fill="#2A3B42"/>
  <rect x="40" y="200" width="140" height="4" rx="2" fill="#5EB8A8"/>
  <circle cx="180" cy="202" r="5" fill="#5EB8A8"/>
  <!-- controls -->
  <rect x="40" y="212" width="12" height="12" rx="2" fill="#5EB8A8"/>
  <rect x="58" y="212" width="12" height="12" rx="2" fill="#5EB8A8"/>
  <rect x="80" y="212" width="12" height="12" rx="2" fill="#2A3B42"/>
  <!-- film icon -->
  <g transform="translate(320,60)">
    <rect x="0" y="0" width="18" height="14" rx="2" fill="#5EB8A8"/>
    <rect x="2" y="2" width="2" height="3" fill="#0C1316"/>
    <rect x="6" y="2" width="2" height="3" fill="#0C1316"/>
    <rect x="10" y="2" width="2" height="3" fill="#0C1316"/>
    <rect x="2" y="9" width="2" height="3" fill="#0C1316"/>
    <rect x="6" y="9" width="2" height="3" fill="#0C1316"/>
    <rect x="10" y="9" width="2" height="3" fill="#0C1316"/>
  </g>
</svg>
