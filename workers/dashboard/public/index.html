<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MySweetPea Dashboard</title>
<link rel="icon" type="image/svg+xml" href="https://mysweetpea.cc/logo-favicon.svg">
<link rel="apple-touch-icon" href="https://mysweetpea.cc/apple-touch-icon.png">
<meta name="theme-color" content="#0C1316">
<link rel="manifest" href="/site.webmanifest">
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url('/fonts/inter-var.woff2') format('woff2')}
@font-face{font-family:'Fraunces';font-style:normal;font-weight:100 900;font-display:swap;src:url('/fonts/fraunces-var.woff2') format('woff2')}

:root{--bg:#0C1316;--primary:#8FAFB5;--primary-dim:#6B9AA6;--primary-bright:#C5D5D8;--ice:#EEF2F3;--sage:#A3C9B6;--slate:#85929E;--gold:#D9A86C;
--text:#EDF3F4;--text-dim:#A9BEC2;--text-faint:#74878C;--border:rgba(143,175,181,.09);--border-primary:rgba(143,175,181,.28);--card-bg:rgba(19,30,34,.55);--card:rgba(19,30,34,.55);--radius:18px;--radius-sm:12px;
--e1:0 1px 2px rgba(0,0,0,.28),0 2px 8px rgba(0,0,0,.22);
--e2:0 2px 6px rgba(0,0,0,.30),0 8px 24px rgba(0,0,0,.28);
--e3:0 12px 40px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.30);
--e4:0 24px 70px rgba(0,0,0,.55),0 4px 16px rgba(0,0,0,.35);
--ring:0 0 0 2px var(--bg),0 0 0 4px var(--primary);
--t-fast:.16s cubic-bezier(.4,0,.2,1);
--t-med:.24s cubic-bezier(.4,0,.2,1);
--t-slow:.4s cubic-bezier(.22,1,.36,1);
--ease-premium:cubic-bezier(.16,1,.3,1);
--nav-bg:rgba(12,19,22,.55);--nav-bg-scrolled:rgba(12,19,22,.8);--nav-pop:rgba(15,24,28,.97);
--card-edge:linear-gradient(180deg,rgba(197,213,216,.09),rgba(197,213,216,0) 36%);--transition:.35s cubic-bezier(.4,0,.2,1);--error:#D98C8C;--success:#A3C9B6;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;min-height:100vh}
#app{display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{position:relative;background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:var(--radius);padding:40px 44px;box-shadow:var(--e1)}
.card::before{content:'';position:absolute;inset:0 0 auto 0;height:1px;background:var(--card-edge);border-radius:var(--radius) var(--radius) 0 0;pointer-events:none}
h1{font-family:'Fraunces','Inter',Georgia,serif;font-weight:600;font-size:1.8rem;margin-bottom:8px}
p{color:var(--text-dim);margin-bottom:24px;line-height:1.6}
a.btn{display:inline-block;background:var(--primary);color:var(--bg);text-decoration:none;font-weight:600;padding:12px 28px;border-radius:var(--radius-sm);transition:var(--t-fast)}
a.btn:hover{background:var(--primary-bright);transform:translateY(-2px)}
/* ---- shell + site-style top nav (phase 14) ---- */
.shell{width:min(1080px,92vw);margin:0 auto;padding:96px 0 0;position:relative;z-index:1}
.top-nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 32px;background:var(--nav-bg);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-bottom:1px solid var(--border);transition:padding .3s var(--ease-premium),background .3s var(--ease-premium)}
.top-nav.nav-scrolled{padding:10px 32px;background:var(--nav-bg-scrolled)}
.brand{font-family:'Fraunces','Inter',Georgia,serif;font-size:1.25rem;display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.brand img{width:28px;height:28px;border-radius:8px;flex:none}
.mark{color:var(--sage)}
.nav-id{display:flex;align-items:center;gap:12px}
.nav-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--sage));display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;color:var(--bg);overflow:hidden;flex:none;cursor:default}
.nav-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.out{color:var(--gold);text-decoration:none;font-size:.9rem}
.out:hover{text-decoration:underline}
.nav-toggle{display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:38px;height:38px;padding:0;background:transparent;border:1px solid rgba(143,175,181,.25);border-radius:10px;cursor:pointer}
.nav-toggle-bar{display:block;width:16px;height:2px;border-radius:2px;background:var(--text-dim);transition:transform .25s var(--ease-premium),opacity .2s}
.top-nav.nav-open .nav-toggle-bar:nth-child(1){transform:translateY(6px) rotate(45deg)}
.top-nav.nav-open .nav-toggle-bar:nth-child(2){opacity:0}
.top-nav.nav-open .nav-toggle-bar:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.hero{display:flex;gap:22px;align-items:center;grid-column:1 / -1}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--sage));display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;color:var(--bg);flex:none}
h2{font-family:'Fraunces','Inter',Georgia,serif;font-weight:600;margin-bottom:2px}
h3{font-family:'Fraunces','Inter',Georgia,serif;font-size:1.05rem;font-weight:600;margin-bottom:10px;letter-spacing:.01em}
.dim{color:var(--text-dim);font-size:.9rem}
.pill{display:inline-block;font-size:.75rem;padding:3px 10px;border-radius:99px;margin-top:8px}
.pill.ok{background:rgba(163,201,182,.15);color:var(--sage)}
.pill.warn{background:rgba(217,168,108,.15);color:var(--gold)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(143,175,181,.08)}
.row:last-child{border-bottom:0}
.row .left{display:flex;flex-direction:column;gap:2px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:10px}
.dot.ok{background:var(--sage);box-shadow:0 0 8px rgba(163,201,182,.5)}
.dot.down{background:var(--error)}
.mini{background:transparent;border:1px solid rgba(143,175,181,.3);color:var(--text-dim);border-radius:8px;padding:4px 12px;cursor:pointer;font-size:.8rem;transition:var(--t-fast)}
.mini:hover{border-color:var(--gold);color:var(--gold)}
.mini.primary{border-color:rgba(143,175,181,.5);color:var(--primary-bright)}
.skel{height:60px;border-radius:10px;background:linear-gradient(90deg,rgba(143,175,181,.06),rgba(143,175,181,.12),rgba(143,175,181,.06));background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.foot{text-align:center;color:var(--text-dim);font-size:.8rem;padding:34px 0}
/* ---- security center ---- */
.sec-checklist{display:flex;flex-direction:column;gap:8px}
.check{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(143,175,181,.07)}
.check:last-child{border-bottom:0}
.check .ico{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex:none}
.check.done .ico{background:rgba(163,201,182,.18);color:var(--sage)}
.check.todo .ico{background:rgba(217,168,108,.15);color:var(--gold)}
.check .label{flex:1;font-size:.92rem}
.check .act{font-size:.8rem;color:var(--gold);cursor:pointer;text-decoration:none}
.check .act:hover{text-decoration:underline}
.ring{width:54px;height:54px;flex:none}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:rgba(143,175,181,.12)}
.ring .fg{stroke:var(--sage);stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}
.ring text{fill:var(--text);font-size:.8rem;text-anchor:middle}
/* ---- modal ---- */
#modal{position:fixed;inset:0;background:rgba(6,10,12,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50}
#modal.open{display:flex}
.mcard{background:#121d21;border:1px solid rgba(143,175,181,.14);border-radius:var(--radius);padding:32px 34px;width:min(440px,92vw);animation:mIn .3s cubic-bezier(.4,0,.2,1)}
@keyframes mIn{from{opacity:0;transform:translateY(14px)}}
.mcard h3{margin-bottom:6px;font-size:1.15rem}
.mcard .sub{color:var(--text-dim);font-size:.88rem;margin-bottom:18px;line-height:1.5}
.mcard input{width:100%;background:#0C1316;border:1px solid rgba(143,175,181,.2);border-radius:10px;color:var(--text);padding:11px 14px;font-size:.95rem;margin-bottom:12px;outline:none;transition:border-color .25s}
.mcard input:focus{border-color:var(--primary)}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.mrow button{border:none;border-radius:10px;padding:10px 20px;font-size:.9rem;cursor:pointer;font-weight:600}
.b-cancel{background:transparent;color:var(--text-dim);border:1px solid rgba(143,175,181,.2)!important}
.b-go{background:var(--primary);color:var(--bg)}
.b-go:hover{background:var(--primary-bright)}
.b-go:disabled{opacity:.5;cursor:wait}
.merr{color:var(--error);font-size:.85rem;min-height:1.2em;margin-bottom:6px}
/* ---- toast ---- */
#toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:10px;z-index:60}
.toast{background:#131F24;border:1px solid rgba(143,175,181,.18);border-radius:12px;box-shadow:var(--e3);backdrop-filter:blur(16px);padding:13px 18px;display:flex;gap:14px;align-items:center;animation:tIn .3s cubic-bezier(.4,0,.2,1);min-width:260px}
@keyframes tIn{from{opacity:0;transform:translateY(12px)}}
.toast.t-out{animation:tOut .25s ease forwards}
@keyframes tOut{to{opacity:0;transform:translateY(8px)}}
.toast .msg{flex:1;font-size:.9rem}
.toast .undo{color:var(--gold);cursor:pointer;font-size:.85rem;text-decoration:underline}
@media(max-width:760px){.grid{grid-template-columns:1fr}}

/* ---- phase 3: palette / stat cards / undo ---- */
.pal-backdrop{position:fixed;inset:0;background:rgba(5,10,12,.66);backdrop-filter:blur(6px);z-index:90;display:none;align-items:flex-start;justify-content:center;padding-top:14vh}
.pal-backdrop.open{display:flex}
.palette{width:min(560px,92vw);background:rgba(15,24,28,.92);border:1px solid rgba(143,175,181,.16);border-radius:16px;overflow:hidden;box-shadow:var(--e4)}
.palette input{width:100%;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:1.05rem;padding:16px 20px;border-bottom:1px solid rgba(143,175,181,.12)}
.pal-list{max-height:320px;overflow-y:auto;padding:8px}
.pal-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;cursor:pointer;color:var(--text)}
.pal-item .dim{font-size:.8rem}
.pal-item.sel,.pal-item:hover{background:rgba(143,175,181,.13)}
.pal-item b{font-weight:600}
.pal-empty{padding:18px;color:var(--text-dim);text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0;grid-column:1/-1}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);backdrop-filter:blur(16px);border:1px solid rgba(143,175,181,.09);border-radius:var(--radius-sm);padding:16px 18px}
.stat .n{font-family:'Fraunces','Inter',Georgia,serif;font-size:1.6rem;font-weight:600;color:var(--primary-bright);font-variant-numeric:tabular-nums}
.stat .l{font-size:.68rem;color:var(--text-dim);margin-top:4px;letter-spacing:.08em;text-transform:uppercase}
.toast{position:relative}
.toast .undo{margin-left:14px;color:var(--gold);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px}
/* ---- phase 4: services launcher grid ---- */
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.svc{display:flex;flex-direction:column;gap:6px;background:var(--card);backdrop-filter:blur(16px);border:1px solid rgba(143,175,181,.09);border-radius:var(--radius-sm);padding:14px;text-decoration:none;color:var(--text);transition:var(--t-fast)}
.svc:hover{transform:translateY(-2px);border-color:var(--border-primary);box-shadow:var(--e2)}
.svc-ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;flex:none}
img.svc-ico{object-fit:contain;padding:3px}
.svc-name{font-size:.92rem;font-weight:600}
.svc-blurb{font-size:.78rem;color:var(--text-dim)}
/* ---- tier badge (phase 13: prominent site-style treatment) ---- */
.tier-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-family:'Inter',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;vertical-align:middle;cursor:default}
.tier-badge svg{width:12px;height:12px}
.tier-badge.lg{font-size:.85rem;padding:7px 16px;gap:8px;letter-spacing:.12em}
.tier-badge.lg svg{width:14px;height:14px}
.tier-sweetpea{background:rgba(217,168,108,.14);color:var(--gold);border:1px solid rgba(217,168,108,.45)}
.tier-seedling{background:rgba(163,201,182,.13);color:var(--sage);border:1px solid rgba(163,201,182,.4)}
.tier-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 6px}
.tier-copy{font-size:.82rem;color:var(--text-dim);line-height:1.5}
.tier-echo{margin-left:10px}
.tier-echo .tier-badge{font-size:.66rem;padding:2px 9px}

/* === nav account dropdown + search (P15) === */
.back-label{font-size:.95rem;color:var(--text-dim);font-family:'Inter',system-ui,sans-serif;font-weight:500;white-space:nowrap}
.brand:hover .back-label{color:var(--text)}
.nav-search{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text-dim);cursor:pointer;transition:var(--t-fast)}
.nav-search:hover{color:var(--text);border-color:var(--border-primary)}
.acct-menu{position:relative}
.acct-trigger{display:inline-flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;border-radius:999px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:border-color var(--t-fast),background var(--t-fast)}
.acct-trigger:hover,.acct-trigger[aria-expanded="true"]{border-color:var(--border-primary);background:var(--card-bg-hover,rgba(143,175,181,.08))}
.acct-trigger .nav-avatar{width:28px;height:28px;font-size:.62rem}
.acct-name{color:var(--text);font-size:.88rem;font-weight:600;max-width:12ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-caret{width:14px;height:14px;color:var(--text-dim);transition:transform var(--t-fast)}
.acct-trigger[aria-expanded="true"] .acct-caret{transform:rotate(180deg)}
.acct-pop{position:absolute;right:0;top:calc(100% + 10px);min-width:230px;background:var(--bg,#0C1316);background:linear-gradient(180deg, rgba(18,26,30,.985), rgba(14,20,24,.985));border:1px solid var(--border-primary);border-radius:14px;box-shadow:var(--e4);padding:6px;z-index:100}
.acct-pop[hidden]{display:none}
.acct-pop-head{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);margin-bottom:6px}
.acct-pop-head .nav-avatar{width:34px;height:34px}
.acct-pop-head b{display:block;font-size:.9rem}
.acct-pop-head .dim{font-size:.75rem;display:block;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-pop-head .tier-pill{display:inline-flex;margin-top:5px}
.acct-pop a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--text);text-decoration:none;font-size:.88rem;transition:background var(--t-fast)}
.acct-pop a:hover{background:rgba(143,175,181,.1)}
.acct-pop a svg{width:16px;height:16px;color:var(--text-dim);flex:none}
.acct-pop a.danger{color:var(--error)}
.acct-pop hr{border:0;border-top:1px solid var(--border);margin:6px 4px}
@media(max-width:760px){.acct-name{display:none}.back-label{font-size:.85rem}}

.acct-trigger.tier-sweetpea{border-color:rgba(217,168,108,.55);box-shadow:0 0 0 1px rgba(217,168,108,.25),0 2px 10px rgba(217,168,108,.12)}
.acct-trigger.tier-sweetpea .acct-name{color:var(--gold)}

/* === end P15 === */

/* ---- phase 5: media rows ---- */
.media-sec{grid-column:1/-1;display:flex;flex-direction:column;gap:18px}
.media-sec:empty{display:none}
.media-row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none}
.media-row::-webkit-scrollbar{display:none}
.mitem{position:relative;flex:none;width:120px;display:block;text-decoration:none;color:var(--text);transition:.35s cubic-bezier(.4,0,.2,1)}
.mitem:hover{transform:translateY(-2px)}
.mposter{width:120px;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:var(--card);display:block}
.mtitle{font-size:.78rem;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msub{font-size:.7rem;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mprog{height:3px;border-radius:99px;background:rgba(143,175,181,.15);margin-top:6px;overflow:hidden}
.mprog i{display:block;height:100%;border-radius:99px;background:var(--gold)}
.mtype{position:absolute;top:6px;left:6px;font-size:.62rem;font-weight:600;padding:2px 8px;border-radius:99px;background:rgba(6,10,12,.72);color:var(--primary-bright);border:1px solid rgba(143,175,181,.25)}
/* ---- phase 6: branding, aesthetics & ux polish ---- */
.brand img{width:28px;height:28px;border-radius:8px;flex:none}
.gate-logo{display:block;width:72px;height:72px;margin:0 auto 18px;border-radius:var(--radius);filter:drop-shadow(0 8px 24px rgba(0,0,0,.35))}
section h3::before{content:"";display:inline-block;width:3px;height:18px;border-radius:99px;background:var(--sage);margin-right:10px;vertical-align:-3px}
.hero{background:radial-gradient(600px 240px at 85% -20%,rgba(163,201,182,.08),transparent 60%),var(--card)}
::selection{background:rgba(217,168,108,.35)}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-thumb{background:rgba(143,175,181,.25);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
.foot img{width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:3px}
.foot a{color:inherit;text-decoration:none;transition:color .35s cubic-bezier(.4,0,.2,1)}
.foot a:hover{color:var(--primary-bright)}
/* ---- phase 8: profile center ---- */
.avatar{position:relative;cursor:pointer}
.avatar.noact{cursor:default}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.av-badge{position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;border-radius:50%;background:#121d21;border:1px solid rgba(143,175,181,.45);color:var(--primary-bright);display:flex;align-items:center;justify-content:center}
.av-badge svg{display:block}
#sec-account .row b{font-size:.92rem}
#sec-account .row{padding:9px 0}
/* ---- phase 9: tabs, uptime bars, library chart ---- */
/* ---- phase 14: tabs as site .nav-btn grammar (underlined text links) ---- */
.nav-tabs{display:flex;flex-wrap:nowrap;gap:8px;align-items:center}
.tab{flex:none;padding:9px 20px;border-radius:999px;cursor:pointer;background:transparent;border:1px solid transparent;color:var(--text-dim);font:inherit;font-size:.88rem;font-weight:600;transition:all .3s var(--ease-premium)}
.tab:hover{color:var(--text);background:rgba(143,175,181,.08)}
.tab.active{background:linear-gradient(135deg,var(--primary),var(--primary-dim) 60%,var(--sage-dim,var(--sage)));color:var(--bg);border-color:rgba(255,255,255,.12);box-shadow:0 4px 16px rgba(94,184,168,.25),inset 0 1px 0 rgba(255,255,255,.2)}
.tab-dot{position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--gold);display:none}
.tab.has-dot .tab-dot{display:block}
.tab-dot{position:absolute;top:5px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--gold);display:none}
.tab.has-dot .tab-dot{display:block}
.tabpanel{grid-column:1/-1;display:flex;flex-direction:column;gap:18px}
.tabpanel[hidden]{display:none}
.strip{display:flex;gap:2px;margin-top:7px}
.strip .b{width:5px;height:14px;border-radius:2px;background:var(--sage);flex:none}
.strip .b.down{background:var(--error)}
.strip .b.pad{background:rgba(143,175,181,.14)}
.up-group{font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);margin:14px 0 0}
.up-row{flex-wrap:wrap}
.up-more{margin:10px 0 0}
.lib-row{display:flex;align-items:center;gap:12px;padding:8px 0}
.lib-l{flex:none;width:78px;font-size:.85rem;color:var(--text-dim)}

(function fallingPetals() {
  const canvas = document.getElementById('petalCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  let reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  if (reduce) return; // static/hidden under reduced motion
  let petals = [];
  let width = 0, height = 0, dpr = 1, rafId = null, resizeTimer = null, lastViewportWidth = 0;
  const PETAL_COUNT = 22;
  function resize(force) {
    const nextWidth = window.innerWidth, nextHeight = window.innerHeight;
    if (!force && nextWidth === lastViewportWidth) return;
    width = nextWidth; height = nextHeight; lastViewportWidth = nextWidth;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function createPetal() {
    return {
      x: Math.random() * width,
      y: -20,
      size: 3 + Math.random() * 6,
      speedY: 0.35 + Math.random() * 0.9,
      speedX: -0.3 + Math.random() * 0.6,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: -0.012 + Math.random() * 0.024,
      opacity: 0.08 + Math.random() * 0.16,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.008 + Math.random() * 0.014,
      tone: Math.random() // 0 = frost/ice, 1 = sage/green
    };
  }
  function drawPetal(petal) {
    ctx.save();
    ctx.translate(petal.x, petal.y);
    ctx.rotate(petal.rotation);
    ctx.globalAlpha = petal.opacity;
    const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, petal.size);
    if (petal.tone > 0.5) {
      gradient.addColorStop(0, '#C4E1CC');
      gradient.addColorStop(0.5, '#A3C9B6');
      gradient.addColorStop(1, 'rgba(93, 122, 110, 0.28)');
    } else {
      gradient.addColorStop(0, '#DDE6E8');
      gradient.addColorStop(0.5, '#B8CDD2');
      gradient.addColorStop(1, 'rgba(143, 175, 181, 0.26)');
    }
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.moveTo(0, -petal.size);
    ctx.bezierCurveTo(petal.size * 0.6, -petal.size * 0.5, petal.size * 0.6, petal.size * 0.5, 0, petal.size);
    ctx.bezierCurveTo(-petal.size * 0.6, petal.size * 0.5, -petal.size * 0.6, -petal.size * 0.5, 0, -petal.size);
    ctx.fill();
    ctx.restore();
  }
  function animate() {
    ctx.clearRect(0, 0, width, height);
    for (let i = 0; i < petals.length; i++) {
      const petal = petals[i];
      petal.sway += petal.swaySpeed;
      petal.x += petal.speedX + Math.sin(petal.sway) * 0.4;
      petal.y += petal.speedY;
      petal.rotation += petal.rotSpeed;
      if (petal.y > height + 20) petals[i] = createPetal();
      if (petal.x < -20) petal.x = width + 20;
      if (petal.x > width + 20) petal.x = -20;
      drawPetal(petals[i]);
    }

  }
  function start() {
    if (rafId !== null || document.hidden) return;
    resize(true);
    petals = [];
    for (let i = 0; i < PETAL_COUNT; i++) {
      const petal = createPetal();
      petal.y = Math.random() * height;
      petals.push(petal);
    }
    animate();
  }
  function stop() {
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    petals = [];
    ctx.clearRect(0, 0, width, height);
  }
  window.addEventListener('resize', function () {
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(function () { if (window.innerWidth !== lastViewportWidth) resize(false); }, 150);
  }, { passive: true });
  document.addEventListener('visibilitychange', function () { document.hidden ? stop() : start(); });
  start();
})();

function guideChipHtml(key, sel) {

  const icon = GUIDE_ICONS[key];
  const inner = icon
    ? '<img class="svc-guide-ico" src="' + esc(icon) + '" alt="" width="28" height="28" loading="lazy">'
    : '<span class="svc-guide-ico" style="color:' + c.fg + ';background:' + c.bg + '">' + esc(g.name[0].toUpperCase()) + '</span>';
  return '<button type="button" class="svc-guide-chip" data-guide="' + esc(key) + '" aria-pressed="' + (key === sel ? 'true' : 'false') + '">' + inner + '<span>' + esc(g.name) + '</span></button>';
}
function platChipHtml(entry) {

}
function platformsHtml(key) {

}
function guideDetailHtml(key) {
  const g = GUIDES[key];
  if (!g) return '';
  let h = '<div class="svc-guide-title">' + esc(g.name) + '</div><p class="svc-guide-intro">' + esc(g.plain) + '</p>';
  if (Array.isArray(g.variants) && g.variants.length) {
    h += '<div class="guide-variants" role="tablist" aria-label="Choose an app">' +
      g.variants.map((v, vi) => '<button type="button" class="guide-variant' + (vi === 0 ? ' active' : '') + '" data-variant="' + vi + '" role="tab" aria-selected="' + (vi === 0 ? 'true' : 'false') + '">' + esc(v.label) + '</button>').join('') +
      '</div>';
    h += g.variants.map((v, vi) => '<div class="guide-variant-panel" data-variant-panel="' + vi + '"' + (vi === 0 ? '' : ' hidden') + '>' +
      v.steps.map((s, i) =>
        '<div class="svc-guide-step"><span class="svc-guide-num">' + (i + 1) + '</span><div class="svc-guide-body"><h4>' + esc(s.title) + '</h4><p>' + esc(s.text) + '</p>' +
        (s.url && s.btn ? '<a class="svc-guide-btn" href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + esc(s.btn) + '</a>' : '') +
        '</div></div>'
      ).join('') + '</div>').join('');
  } else {
    (g.steps || []).forEach((s, i) => {
    h += '<div class="svc-guide-step"><span class="svc-guide-num">' + (i + 1) + '</span><div class="svc-guide-body"><h4>' + esc(s.title) + '</h4><p>' + esc(s.text) + '</p>' +
      (s.url && s.btn ? '<a class="svc-guide-btn" href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + esc(s.btn) + '</a>' : '') +
      '</div></div>';
    });
  }
  h += platformsHtml(key);
  return h;
}

  // ===== PHASE 13: asciiRipple — garden ASCII wave strip (Bayer-dithered, rAF @100ms) =====
  (function initAsciiRipple() {
    const strips = Array.prototype.slice.call(document.querySelectorAll('.ripple-strip'));
    if (!strips.length) return;
    const RAMP = ' .:-=+xX#8@';
    const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
    const ROWS = 6;
    let reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    const state = strips.map((el) => ({ el: el, cols: 0, visible: true }));
    function wave(t, cols) {
      const cx = (cols - 1) / 2, cy = (ROWS - 1) / 2;
      const maxD = Math.sqrt(cx * cx + cy * cy * 4.84) || 1;
      const lines = [];
      for (let y = 0; y < ROWS; y++) {
        let line = '';
        for (let x = 0; x < cols; x++) {
          const dx = x - cx, dy = (y - cy) * 2.2;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const env = Math.max(0, 1 - dist / maxD);
          const v = Math.pow(0.5 + 0.5 * Math.sin(dist * 0.3 - t * 0.35), 3.5) * env;
          const b = BAYER[y & 3][x & 3] / 16;
          const lv = Math.min(RAMP.length - 1, Math.max(0, Math.floor(v * (RAMP.length - 1) + b)));
          line += RAMP[lv];
        }
        lines.push(line);
      }
      return lines.join('\n');
    }
    function rebuild() {
      state.forEach((s) => {
        const w = Math.max(240, (s.el.clientWidth || 760) - 40);
        s.cols = Math.max(40, Math.min(120, Math.floor(w / 6)));
      });
    }
    function paint(t) {
      state.forEach((s) => { if (s.cols) s.el.textContent = wave(t, s.cols); });
    }
    rebuild();
    paint(0);
    if (reduce) return; // one static frame only
    let raf = 0, last = -1000, rt = 0;
    const anyVisible = () => state.some((s) => s.visible);
    function tick(now) {
      raf = 0;
      if (document.hidden || !anyVisible()) return;
      if (now - last >= 100) { last = now; paint(now / 1000); }
      raf = requestAnimationFrame(tick);
    }
    function start() { if (!raf && !document.hidden && anyVisible()) raf = requestAnimationFrame(tick); }
    const io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        const s = state.find((x) => x.el === en.target);
        if (s) { s.visible = en.isIntersecting; if (en.isIntersecting) start(); }
      });
    }, { threshold: 0 });
    state.forEach((s) => io.observe(s.el));
    document.addEventListener('visibilitychange', () => { if (!document.hidden) start(); });
    window.addEventListener('resize', () => {
      clearTimeout(rt);
      rt = setTimeout(() => { rebuild(); }, 200);
    });
    start();
  })();

  (function initPasswordForm() {
    const cur = document.getElementById('pw-current');
    const nw = document.getElementById('pw-new');
    const cf = document.getElementById('pw-confirm');
    const btn = document.getElementById('pw-save');
    const err = document.getElementById('pw-err');
    if (!cur || !nw || !cf || !btn) return;
    const validate = () => {
      const okLen = nw.value.length >= 12;
      const okMatch = cf.value.length > 0 && cf.value === nw.value;
      btn.disabled = !(cur.value.length > 0 && okLen && okMatch);
      return okLen && okMatch;
    };
    [cur, nw, cf].forEach((el) => el.addEventListener('input', validate));
    btn.addEventListener('click', async () => {
      err.textContent = '';
      if (!validate()) {
        err.textContent = nw.value.length < 12 ? 'New password must be at least 12 characters.' : 'Passwords do not match.';
        return;
      }
      btn.disabled = true;
      try {
        const r = await fetch('/api/password/change', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ currentPassword: cur.value, newPassword: nw.value }) });
        const d = await r.json().catch(() => ({}));
        if (r.ok && d.ok) {
          cur.value = ''; nw.value = ''; cf.value = '';
          validate();
          toast('Password updated — use it everywhere you sign in.', { ok: true });

          err.textContent = d.error || 'Password change failed.';

  (function initSuggest() {
    const form = document.getElementById('sgf');
    if (!form) return;
    const SUGGEST_URL = 'https://subscribe.mysweetpea.cc/webhook/suggest';
    const submit = document.getElementById('sg-submit');
    const fields = [
      { el: document.getElementById('sg-name'), type: 'name' },
      { el: document.getElementById('sg-url'), type: 'url' },
      { el: document.getElementById('sg-category'), type: 'category', okText: 'Category selected.', badText: 'Please select a category.' },
      { el: document.getElementById('sg-reason'), type: 'reason' },
    ];
    const validate = (f) => {
      const val = String(f.el.value || '').trim();
      const hint = document.getElementById(f.el.id + '-hint');
      let valid = false;
      if (f.type === 'name') valid = val.length >= 2;
      else if (f.type === 'url') valid = val === '' || /^https?:\/\/.+\..+/.test(val);
      else if (f.type === 'category') valid = val !== '';
      else if (f.type === 'reason') valid = val.length >= 10;
      f.el.classList.remove('valid', 'invalid');
      if (val.length > 0 || f.type === 'category') {
        f.el.classList.add(valid ? 'valid' : 'invalid');
        if (hint) {
          hint.classList.toggle('error', !valid);
          hint.classList.toggle('success', valid);
          if (f.okText) hint.textContent = valid ? f.okText : (f.badText || f.okText);
        }
      } else if (hint) hint.classList.remove('error', 'success');
      return valid;
    };
    const checkSubmit = () => { submit.disabled = !fields.every(validate); };
    fields.forEach((f) => ['input', 'change', 'blur'].forEach((ev) => f.el.addEventListener(ev, () => checkSubmit())));
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!fields.every(validate)) { toast('Please fix the highlighted fields', { err: true }); return; }
      submit.disabled = true;
      submit.textContent = 'Sending…';
      const payload = {
        service_name: fields[0].el.value.trim(),
        project_url: fields[1].el.value.trim() || '',
        category: fields[2].el.value.trim(),
        reason: fields[3].el.value.trim(),
        your_name: String(document.getElementById('sg-yourname').value || '').trim() || '',
        your_email: String(document.getElementById('sg-youremail').value || '').trim() || ''
      };
      fetch(SUGGEST_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .then((r) => r.text().then((t) => { let d = { ok: r.ok }; if (t) { try { d = JSON.parse(t); } catch (e2) {} } return d; }))
        .then((d) => {
          if (d && d.ok) {
            toast('Thanks — suggestion sent!', { ok: true });
            form.reset();
          } else {
            toast((d && d.msg) || 'Submission failed — please try again', { err: true });
          }
        })
        .catch(() => { toast('Network error. Try again.', { err: true }); })
        .then(() => {
          submit.textContent = 'Send suggestion';
          fields.forEach((f) => { f.el.classList.remove('valid', 'invalid'); const h = document.getElementById(f.el.id + '-hint'); if (h) { h.classList.remove('error', 'success'); if (f.okText) h.textContent = f.badText; } });
          checkSubmit();
        });
    });
  })();

    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
  const DEV_ICONS = {
    desktop: DEV_SVG + '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>',
    laptop: DEV_SVG + '<rect x="4" y="4" width="16" height="11" rx="2"/><path d="M2 19h20"/></svg>',
    mobile: DEV_SVG + '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>',
    tablet: DEV_SVG + '<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M11 18h2"/></svg>',
    tv: DEV_SVG + '<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>'
  };
  function uaString(s) {
    if (typeof s.user_agent === 'string' && s.user_agent) return s.user_agent;
    if (s.agent && typeof s.agent === 'object') return String(s.agent.raw || s.agent.device || s.agent.os || '');
    return '';
  }
  function devType(ua) {
    if (/TV|Tizen|WebOS|webOS|SmartTV|AppleTV|GoogleTV|CrKey/i.test(ua)) return 'tv';
    if (/iPad|Tablet|Kindle|Nook|PlayBook|Silk/i.test(ua)) return 'tablet';
    if (/iPhone|iPod|Android.*Mobile|Windows Phone|BlackBerry|Opera Mini/i.test(ua)) return 'mobile';
    if (/Android/i.test(ua)) return 'mobile';
    if (/Windows|Macintosh|Mac OS|X11|CrOS|Ubuntu|Linux/i.test(ua)) return 'desktop';
    return 'laptop';
  }
  function devLabel(ua, type) {
    if (type === 'tv') return 'TV device';
    if (type === 'tablet') return /iPad/i.test(ua) ? 'iPad' : 'Tablet';
    if (type === 'mobile') {
      if (/iPhone/i.test(ua)) return 'iPhone';
      if (/Android/i.test(ua)) return 'Android device';
      if (/Windows Phone/i.test(ua)) return 'Windows phone';
      return 'Mobile device';
    }
    if (/Windows/i.test(ua)) return 'Windows desktop';
    if (/Macintosh|Mac OS/i.test(ua)) return 'Mac desktop';
    if (/Ubuntu/i.test(ua)) return 'Ubuntu desktop';
    if (/Linux|X11/i.test(ua)) return 'Linux desktop';
    if (/CrOS/i.test(ua)) return 'Chromebook';
    return 'Device';
  }
  fetch('/api/sessions').then(r => r.json()).then(d => {
    const el = $('#sec-sessions'); const list = (d && d.results) || [];
    if (!list.length) { el.innerHTML = '<p class="eyebrow">Sessions</p><h3>Your sessions</h3><p class="dim">No sessions found.</p>'; return; }
    el.innerHTML = '<p class="eyebrow">Sessions</p><h3>Your sessions</h3>' +
      '<div class="sess-head"><span>Device</span><span>Last seen</span><span>Location / IP</span><span>Action</span></div>' +
      list.slice(0, 6).map(s => {
        const ua = uaString(s);
        const type = devType(ua);
        const label = s.current_session ? (devLabel(ua, type) + ' (this device)') : devLabel(ua, type);
        return '<div class="sess-row">' +
          '<span class="sess-dev">' + DEV_ICONS[type] + '<b>' + esc(devLabel(ua, type)) + '</b>' + (s.current_session ? '<span class="pill ok">This device</span>' : '') + '</span>' +
          '<span class="dim">' + esc(relTime(s.last_seen) || '—') + '</span>' +
          '<span class="dim">' + esc(s.last_ip || '—') + '</span>' +
          '<span class="sess-act">' + (s.current_session ? '' : '<button class="mini" data-sid="' + esc(s.uuid) + '" aria-label="Revoke session on ' + esc(label) + '">Revoke</button>') + '</span></div>';
      }).join('') + '<div class="row"><div class="left"><b>Sign out everywhere</b><span class="dim">End all other sessions</span></div><button class="mini" id="revoke-all">Revoke all</button></div>';
    el.querySelectorAll('button.mini[data-sid]').forEach(b => b.onclick = async () => {
      b.disabled = true; b.textContent = '…';
      await fetch('/api/sessions/' + b.dataset.sid, { method: 'DELETE' });
      const row = b.closest('.row'); row.style.opacity = .35; b.textContent = 'Revoked';
      toast('Session signed out', { action: () => location.reload(), label: 'Reload' });
    });
    const all = el.querySelector('#revoke-all');
    if (all) all.onclick = async () => {
      modal('<h3>Sign out everywhere?</h3><p class="sub">This ends every session except the one you are using now.</p><div class="mrow"><button class="b-cancel" onclick="closeModal()">Cancel</button><button class="b-go" id="confirm-all">Sign them out</button></div>');
      $('#confirm-all').onclick = async () => {
        closeModal();
        const others = list.filter(s => !s.current_session);
        for (const s of others) await fetch('/api/sessions/' + s.uuid, { method: 'DELETE' });
        toast('Signed out ' + others.length + ' session' + (others.length === 1 ? '' : 's'));
        setTimeout(() => location.reload(), 900);
      };
    };
  }).catch(() => { $('#sec-sessions').innerHTML = '<p class="eyebrow">Sessions</p><h3>Your sessions</h3><p class="dim">Unavailable.</p>'; });

  // ===== CONNECTED APPS =====
  fetch('/api/consents').then(r => r.json()).then(d => {
    const el = $('#sec-apps'); const list = (d && d.results) || [];
    if (!list.length) { el.innerHTML = '<p class="eyebrow">Connected apps</p><h3>Connected apps</h3><p class="dim">No app consents yet.</p>'; return; }
    el.innerHTML = '<p class="eyebrow">Connected apps</p><h3>Connected apps</h3>' + list.map(c => '<div class="row"><div class="left"><b>' + esc((c.application && c.application.name) || 'Application') + '</b></div><span class="dim">' + new Date(c.expires || Date.now()).toLocaleDateString() + '</span></div>').join('');
  }).catch(() => { $('#sec-apps').innerHTML = '<p class="eyebrow">Connected apps</p><h3>Connected apps</h3><p class="dim">Unavailable.</p>'; });
})();
</script>
<script>
'use strict';
/* ================= PHASE 3+9: command palette + stat cards + library chart ================= */
(function () {
  const COMMANDS = [
    { t: 'Go to Home',                 d: 'Dashboard tab',             run: () => setTab('home') },
    { t: 'Go to Statistics',           d: 'Library, photos & members', run: () => setTab('stats') },
    { t: 'Go to Media',                d: 'Watch & library stats',     run: () => setTab('media') },
    { t: 'Go to Services',             d: 'Launchers & uptime',        run: () => setTab('services') },
    { t: 'Go to Guides',               d: 'Setup how-tos per service', run: () => setTab('guides') },
    { t: 'Go to Contact',              d: 'Email us anytime',          run: () => setTab('contact') },
    { t: 'Go to Security',             d: 'Checklist, MFA, sessions',  run: () => setTab('security') },
    { t: 'Go to Account',              d: 'Profile & avatar',          run: () => setTab('account') },
    { t: 'Change password',            d: 'Account tab · inline form',  run: () => { setTab('account'); const el = document.getElementById('pw-current'); if (el) el.focus(); } },
    { t: 'Set up TOTP',                d: 'Authentik · MFA',           run: () => ceremony('mfa', 'TOTP setup') },
    { t: 'Add a passkey',              d: 'Authentik · MFA',           run: () => ceremony('mfa', 'Passkey setup') },
    { t: 'Recovery codes',             d: 'Authentik · MFA',           run: () => ceremony('mfa', 'Recovery codes') },
    { t: 'Manage sessions',            d: 'Authentik · sessions',      run: () => { goSection('sec-sessions'); ceremony('sessions', 'Sessions'); } },
    { t: 'Sign out everywhere',        d: 'Revoke all other sessions', run: () => { goSection('sec-sessions'); revokeAll(); } },
    { t: 'Open Jellyfin',              d: 'media.mysweetpea.cc',       run: () => location.assign('https://media.mysweetpea.cc') },
    { t: 'Open Vaultwarden',           d: 'vault.mysweetpea.cc',       run: () => location.assign('https://vault.mysweetpea.cc') },
    { t: 'Open Nextcloud',             d: 'cloud.mysweetpea.cc',       run: () => location.assign('https://cloud.mysweetpea.cc') },
    { t: 'Open Photos (Immich)',       d: 'photos.mysweetpea.cc',      run: () => location.assign('https://photos.mysweetpea.cc') },
    { t: 'Open Notes (AFFiNE)',        d: 'notes.mysweetpea.cc',       run: () => location.assign('https://notes.mysweetpea.cc') },
      ];
  let sel = 0, filtered = COMMANDS.slice();

  const pal = $('#pal'), input = $('#pal-q'), list = $('#pal-list');

  function render() {
    if (!filtered.length) { list.innerHTML = '<div class="pal-empty">No matching commands</div>'; return; }
    list.innerHTML = filtered.map((c, i) =>
      '<div class="pal-item' + (i === sel ? ' sel' : '') + '" data-i="' + i + '">' +
      '<b>' + esc(c.t) + '</b><span class="dim">' + esc(c.d) + '</span></div>').join('');
    list.querySelectorAll('.pal-item').forEach(el => {
      el.onclick = () => { close(); filtered[+el.dataset.i].run(); };
      el.onmouseenter = () => { sel = +el.dataset.i; render(); };
    });
    const s = list.querySelector('.sel'); if (s) s.scrollIntoView({ block: 'nearest' });
  }
  function open()  { pal.classList.add('open'); input.value = ''; filtered = COMMANDS.slice(); sel = 0; render(); setTimeout(() => input.focus(), 0); }
  function close() { pal.classList.remove('open'); input.blur(); }

  window.mspPalette = { open, close };

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    filtered = !q ? COMMANDS.slice() : COMMANDS.filter(c => (c.t + ' ' + c.d).toLowerCase().includes(q));
    sel = 0; render();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, filtered.length - 1); render(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); render(); }
    else if (e.key === 'Enter')  { e.preventDefault(); if (filtered[sel]) { close(); filtered[sel].run(); } }
    else if (e.key === 'Escape') { close(); }
  });
  pal.addEventListener('mousedown', (e) => { if (e.target === pal) close(); });

  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); pal.classList.contains('open') ? close() : open(); }
  });

  /* ---- stat tiles (count-up) + library bar chart ---- */
  function waitFor(sel) {
    return new Promise(resolve => {
      const el = document.querySelector(sel);
      if (el) return resolve(el);
      const t = setInterval(() => { const e2 = document.querySelector(sel); if (e2) { clearInterval(t); resolve(e2); } }, 120);
      setTimeout(() => { clearInterval(t); resolve(null); }, 15000);
    });
  }
  function dashRow() {
    return '<div class="stat"><div class="n">—</div><div class="l">Movies</div></div>' +
      '<div class="stat"><div class="n">—</div><div class="l">Series</div></div>' +
      '<div class="stat"><div class="n">—</div><div class="l">Photos</div></div>' +
      '<div class="stat"><div class="n">—</div><div class="l">Active sessions</div></div>';
  }
  function statTmpl() {
    const mk = (k, l) => '<div class="stat"><div class="n" data-k="' + k + '">0</div><div class="l">' + esc(l) + '</div></div>';
    return mk('movies', 'Movies') + mk('series', 'Series') + mk('photos', 'Photos') + mk('sessions', 'Active sessions');
  }
  function libHtml(s) {
    const rows = [['Movies', s.movies], ['Episodes', s.episodes], ['Series', s.series], ['Songs', s.songs], ['Boxsets', s.boxsets]].filter((x) => x[1] != null);
    if (!rows.length) return '<p class="dim">No library data yet.</p>';
    const max = Math.max.apply(null, rows.map((x) => x[1]).concat([1]));
    return rows.map((x) => '<div class="lib-row"><span class="lib-l">' + esc(x[0]) + '</span><span class="lib-bar"><i style="width:' + Math.max(2, Math.round(x[1] / max * 100)) + '%"></i></span><span class="lib-n">' + x[1].toLocaleString() + '</span></div>').join('');
  }
  (async () => {
    const el = await waitFor('#stats');
    if (!el) return;
    el.innerHTML = dashRow();
    let d = {};
    try {
      const r = await fetch('/api/stats');
      if (r.ok) d = await r.json();
    } catch (e) { /* keep dashes */ }
    const s = mergeStats(d);
    el.innerHTML = statTmpl();
    el.querySelectorAll('.stat .n').forEach((n) => countUp(n, s[n.dataset.k]));
    const lib = document.getElementById('lib-body');
    if (lib) lib.innerHTML = libHtml(s);
  })();

  /* palette button (topbar is built dynamically -> delegated) */
  document.addEventListener('click', (e) => {
    if (e.target && e.target.id === 'pal-open') { e.preventDefault(); window.mspPalette.open(); }
  });
})();

  // ===== account dropdown: delegated handlers (work regardless of render timing) =====
  (function () {
    'use strict';
    const getTrig = () => document.getElementById('acct-trigger');
    const getPop  = () => document.getElementById('acct-pop');
    function close() {
      const pop = getPop(), trig = getTrig();
      if (pop && !pop.hidden) { pop.hidden = true; }
      if (trig) trig.setAttribute('aria-expanded', 'false');
    }
    document.addEventListener('click', (e) => {
      const trig = e.target.closest ? e.target.closest('#acct-trigger') : null;
      const pop = getPop();
      if (trig) {
        e.preventDefault(); e.stopPropagation();
        if (!pop) return;
        const open = pop.hidden;
        pop.hidden = !open;
        trig.setAttribute('aria-expanded', String(open));
        return;
      }
      // outside click or any menu item click closes
      if (pop && !pop.hidden && !(e.target.closest && e.target.closest('#acct-pop'))) close();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
    // guide variant picker (Moonfin / Jellyfin Web)
    document.addEventListener('click', (e) => {
      const btn = e.target && e.target.closest ? e.target.closest('.guide-variant') : null;
      if (!btn) return;
      const wrap = btn.closest('.svc-guide-detail');
      if (!wrap) return;
      const idx = btn.getAttribute('data-variant');
      wrap.querySelectorAll('.guide-variant').forEach((b) => { const on = b === btn; b.classList.toggle('active', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); });
      wrap.querySelectorAll('.guide-variant-panel').forEach((p) => { p.hidden = p.getAttribute('data-variant-panel') !== idx; });
    });
    // menu items: switch tab directly (deterministic — no reliance on hash events)
    document.addEventListener('click', (e) => {
      const item = e.target && e.target.closest ? e.target.closest('#acct-pop [data-goto]') : null;
      if (!item) return;
      e.preventDefault();
      const t = item.getAttribute('data-goto');
      if (typeof window.setTab === 'function') window.setTab(t); else location.hash = t;
      close();
    });
    // tab switches should also close it
    window.addEventListener('hashchange', close);
  })();
</script>
</body></html>
