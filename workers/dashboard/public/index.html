<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MySweetPea Dashboard</title>
<link rel="icon" type="image/svg+xml" href="https://mysweetpea.cc/logo-favicon.svg">
<link rel="apple-touch-icon" href="https://mysweetpea.cc/apple-touch-icon.png">
<meta name="theme-color" content="#0C1316">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap">
<style>
:root{--bg:#0C1316;--primary:#8FAFB5;--primary-bright:#C5D5D8;--sage:#A3C9B6;--gold:#D9A86C;
--text:#EDF3F4;--text-dim:#A9BEC2;--card:rgba(19,30,34,.55);--radius:18px;--radius-sm:12px;--error:#D98C8C}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}
#app{display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:var(--card);backdrop-filter:blur(16px);border:1px solid rgba(143,175,181,.09);border-radius:var(--radius);padding:40px 44px}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.8rem;margin-bottom:8px}
p{color:var(--text-dim);margin-bottom:24px;line-height:1.6}
a.btn{display:inline-block;background:var(--primary);color:var(--bg);text-decoration:none;font-weight:600;padding:12px 28px;border-radius:var(--radius-sm);transition:.35s cubic-bezier(.4,0,.2,1)}
a.btn:hover{background:var(--primary-bright);transform:translateY(-2px)}
/* ---- shell ---- */
.shell{width:min(1080px,92vw);margin:0 auto;padding:28px 0 0}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 0 26px}
.brand{font-family:Fraunces,Georgia,serif;font-size:1.25rem;display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.mark{color:var(--sage)}
.who{display:flex;align-items:center;gap:14px}
.name{color:var(--text-dim);font-size:.95rem}
.out{color:var(--gold);text-decoration:none;font-size:.9rem}
.out:hover{text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.hero{display:flex;gap:22px;align-items:center;grid-column:1 / -1}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--sage));display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;color:var(--bg);flex:none}
h2{font-family:Fraunces,Georgia,serif;font-weight:600;margin-bottom:2px}
h3{font-family:Fraunces,Georgia,serif;font-size:1.05rem;font-weight:600;margin-bottom:10px;letter-spacing:.01em}
.dim{color:var(--text-dim);font-size:.9rem}
.pill{display:inline-block;font-size:.75rem;padding:3px 10px;border-radius:99px;margin-top:8px}
.pill.ok{background:rgba(163,201,182,.15);color:var(--sage)}
.pill.warn{background:rgba(217,168,108,.15);color:var(--gold)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(143,175,181,.08)}
.row:last-child{border-bottom:0}
.row .left{display:flex;flex-direction:column;gap:2px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:10px}
.dot.ok{background:var(--sage);box-shadow:0 0 8px rgba(163,201,182,.5)}
.dot.down{background:var(--error)}
.mini{background:transparent;border:1px solid rgba(143,175,181,.3);color:var(--text-dim);border-radius:8px;padding:4px 12px;cursor:pointer;font-size:.8rem;transition:.35s cubic-bezier(.4,0,.2,1)}
.mini:hover{border-color:var(--gold);color:var(--gold)}
.mini.primary{border-color:rgba(143,175,181,.5);color:var(--primary-bright)}
.skel{height:60px;border-radius:10px;background:linear-gradient(90deg,rgba(143,175,181,.06),rgba(143,175,181,.12),rgba(143,175,181,.06));background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.foot{text-align:center;color:var(--text-dim);font-size:.8rem;padding:34px 0}
/* ---- security center ---- */
.sec-checklist{display:flex;flex-direction:column;gap:8px}
.check{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(143,175,181,.07)}
.check:last-child{border-bottom:0}
.check .ico{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex:none}
.check.done .ico{background:rgba(163,201,182,.18);color:var(--sage)}
.check.todo .ico{background:rgba(217,168,108,.15);color:var(--gold)}
.check .label{flex:1;font-size:.92rem}
.check.todo .label{color:var(--text-dim)}
.check .act{font-size:.8rem;color:var(--gold);cursor:pointer;text-decoration:none}
.check .act:hover{text-decoration:underline}
.ring{width:54px;height:54px;flex:none}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:rgba(143,175,181,.12)}
.ring .fg{stroke:var(--sage);stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}
.ring text{fill:var(--text);font-size:.8rem;text-anchor:middle}
/* ---- modal ---- */
#modal{position:fixed;inset:0;background:rgba(6,10,12,.72);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50}
#modal.open{display:flex}
.mcard{background:#121d21;border:1px solid rgba(143,175,181,.14);border-radius:var(--radius);padding:32px 34px;width:min(440px,92vw);animation:mIn .3s cubic-bezier(.4,0,.2,1)}
@keyframes mIn{from{opacity:0;transform:translateY(14px)}}
.mcard h3{margin-bottom:6px;font-size:1.15rem}
.mcard .sub{color:var(--text-dim);font-size:.88rem;margin-bottom:18px;line-height:1.5}
.mcard input{width:100%;background:#0C1316;border:1px solid rgba(143,175,181,.2);border-radius:10px;color:var(--text);padding:11px 14px;font-size:.95rem;margin-bottom:12px;outline:none;transition:border-color .25s}
.mcard input:focus{border-color:var(--primary)}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.mrow button{border:none;border-radius:10px;padding:10px 20px;font-size:.9rem;cursor:pointer;font-weight:600}
.b-cancel{background:transparent;color:var(--text-dim);border:1px solid rgba(143,175,181,.2)!important}
.b-go{background:var(--primary);color:var(--bg)}
.b-go:hover{background:var(--primary-bright)}
.b-go:disabled{opacity:.5;cursor:wait}
.merr{color:var(--error);font-size:.85rem;min-height:1.2em;margin-bottom:6px}
/* ---- toast ---- */
#toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:10px;z-index:60}
.toast{background:#131F24;border:1px solid rgba(143,175,181,.18);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.45);backdrop-filter:blur(16px);padding:13px 18px;display:flex;gap:14px;align-items:center;animation:tIn .3s cubic-bezier(.4,0,.2,1);min-width:260px}
@keyframes tIn{from{opacity:0;transform:translateY(12px)}}
.toast.t-out{animation:tOut .25s ease forwards}
@keyframes tOut{to{opacity:0;transform:translateY(8px)}}
.toast .msg{flex:1;font-size:.9rem}
.toast .undo{color:var(--gold);cursor:pointer;font-size:.85rem;text-decoration:underline}
@media(max-width:760px){.grid{grid-template-columns:1fr}}

/* ---- phase 3: palette / stat cards / undo ---- */
.pal-backdrop{position:fixed;inset:0;background:rgba(5,10,12,.66);backdrop-filter:blur(6px);z-index:90;display:none;align-items:flex-start;justify-content:center;padding-top:14vh}
.pal-backdrop.open{display:flex}
.palette{width:min(560px,92vw);background:rgba(15,24,28,.92);border:1px solid rgba(143,175,181,.16);border-radius:16px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.palette input{width:100%;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:1.05rem;padding:16px 20px;border-bottom:1px solid rgba(143,175,181,.12)}
.pal-list{max-height:320px;overflow-y:auto;padding:8px}
.pal-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;cursor:pointer;color:var(--text)}
.pal-item .dim{font-size:.8rem}
.pal-item.sel,.pal-item:hover{background:rgba(143,175,181,.13)}
.pal-item b{font-weight:600}
.pal-empty{padding:18px;color:var(--text-dim);text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0;grid-column:1/-1}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);backdrop-filter:blur(16px);border:1px solid rgba(143,175,181,.09);border-radius:var(--radius-sm);padding:16px 18px}
.stat .n{font-family:Fraunces,Georgia,serif;font-size:1.6rem;font-weight:600;color:var(--primary-bright)}
.stat .l{font-size:.68rem;color:var(--text-dim);margin-top:4px;letter-spacing:.08em;text-transform:uppercase}
.toast{position:relative}
.toast .undo{margin-left:14px;color:var(--gold);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px}
/* ---- phase 4: services launcher grid ---- */
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.svc{display:flex;flex-direction:column;gap:6px;background:var(--card);backdrop-filter:blur(16px);border:1px solid rgba(143,175,181,.09);border-radius:var(--radius-sm);padding:14px;text-decoration:none;color:var(--text);transition:.35s cubic-bezier(.4,0,.2,1)}
.svc:hover{transform:translateY(-2px);border-color:rgba(143,175,181,.4)}
.svc-ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;flex:none}
.svc-name{font-size:.92rem;font-weight:600}
.svc-blurb{font-size:.78rem;color:var(--text-dim)}
/* ---- phase 5: media rows ---- */
.media-sec{grid-column:1/-1;display:flex;flex-direction:column;gap:18px}
#sec-media:empty{display:none}
.media-row{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none}
.media-row::-webkit-scrollbar{display:none}
.mitem{position:relative;flex:none;width:120px;display:block;text-decoration:none;color:var(--text);transition:.35s cubic-bezier(.4,0,.2,1)}
.mitem:hover{transform:translateY(-2px)}
.mposter{width:120px;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:var(--card);display:block}
.mtitle{font-size:.78rem;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msub{font-size:.7rem;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mprog{height:3px;border-radius:99px;background:rgba(143,175,181,.15);margin-top:6px;overflow:hidden}
.mprog i{display:block;height:100%;border-radius:99px;background:var(--gold)}
.mtype{position:absolute;top:6px;left:6px;font-size:.62rem;font-weight:600;padding:2px 8px;border-radius:99px;background:rgba(6,10,12,.72);color:var(--primary-bright);border:1px solid rgba(143,175,181,.25)}
/* ---- phase 6: branding, aesthetics & ux polish ---- */
.brand img{width:28px;height:28px;border-radius:8px;flex:none}
.gate-logo{display:block;width:72px;height:72px;margin:0 auto 18px;border-radius:var(--radius);filter:drop-shadow(0 8px 24px rgba(0,0,0,.35))}
section h3::before{content:"";display:inline-block;width:3px;height:18px;border-radius:99px;background:var(--sage);margin-right:10px;vertical-align:-3px}
.hero{background:radial-gradient(600px 240px at 85% -20%,rgba(163,201,182,.08),transparent 60%),var(--card)}
::selection{background:rgba(217,168,108,.35)}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-thumb{background:rgba(143,175,181,.25);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
.foot img{width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:3px}
.foot a{color:inherit;text-decoration:none;transition:color .35s cubic-bezier(.4,0,.2,1)}
.foot a:hover{color:var(--primary-bright)}
/* ---- phase 8: profile center ---- */
.avatar{position:relative;cursor:pointer}
.avatar.noact{cursor:default}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.av-badge{position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;border-radius:50%;background:#121d21;border:1px solid rgba(143,175,181,.45);color:var(--primary-bright);display:flex;align-items:center;justify-content:center}
.av-badge svg{display:block}
#sec-account .row b{font-size:.92rem}
#sec-account .row{padding:9px 0}
@media (prefers-reduced-motion: no-preference){
html{scroll-behavior:smooth}
@keyframes msp-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
main section{opacity:0;animation:msp-in .5s ease-out forwards;animation-delay:calc(var(--i,0)*60ms)}
}
</style></head><body>
<div id="app"><div class="card" id="gate"><a href="https://mysweetpea.cc" style="display:block;color:inherit;text-decoration:none"><img class="gate-logo" src="https://mysweetpea.cc/logo.svg" alt="MySweetPea logo"/></a><h1>MySweetPea</h1><p>Checking your session…</p></div></div>
<div id="modal"><div class="mcard" id="mbody"></div></div>
<div id="toasts"></div>

<div class="pal-backdrop" id="pal">
  <div class="palette">
    <input id="pal-q" type="text" placeholder="Type a command…  (Esc to close)" autocomplete="off" spellcheck="false"/>
    <div class="pal-list" id="pal-list"></div>
  </div>
</div>


<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (x) => String(x == null ? '' : x).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, opts) {
  // opts: { action: fn, label: 'Undo' } -> action button inside the toast
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = '<span class="msg">' + esc(msg) + '</span>' + (opts && opts.action ? '<span class="undo">' + esc((opts && opts.label) || 'Undo') + '</span>' : '');
  if (opts && opts.action) t.querySelector('.undo').onclick = () => { t.remove(); opts.action(); };
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('t-out'); setTimeout(() => t.remove(), 260); }, 6500);
}
function modal(html) { $('#mbody').innerHTML = html; $('#modal').classList.add('open'); }
function closeModal() { $('#modal').classList.remove('open'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

// Popup ceremony helper (authentik-hosted, branded, deep-links back)
async function revokeAll() {
  const d = await (await fetch('/api/sessions')).json();
  const others = ((d && d.results) || []).filter(s => !s.current_session);
  if (!others.length) { toast('No other sessions to sign out'); return; }
  for (const s of others) await fetch('/api/sessions/' + s.uuid, { method: 'DELETE' });
  toast('Signed out ' + others.length + ' session' + (others.length === 1 ? '' : 's'), { action: () => location.reload(), label: 'Reload' });
}
function ceremony(flowSlug, label) {
  const url = '/auth/ceremony?f=' + encodeURIComponent(flowSlug);
  const w = window.open(url, 'msp-ceremony', 'width=480,height=680');
  const timer = setInterval(() => {
    if (w.closed) { clearInterval(timer); location.reload(); }
  }, 700);
  toast(label + ' opened - complete it in the popup');
}

(async () => {
  const app = $('#app'); const gate = $('#gate');
  let me = null;
  try { const r = await fetch('/api/me'); if (r.ok) me = await r.json(); } catch (e) {}
  if (!me) {
    gate.innerHTML = '<a href="https://mysweetpea.cc" style="display:block;color:inherit;text-decoration:none"><img class="gate-logo" src="https://mysweetpea.cc/logo.svg" alt="MySweetPea logo"/></a><h1>MySweetPea</h1><p>Sign in with your MySweetPea account to manage everything in one place.</p><a class="btn" href="/auth/login">Sign in with MySweetPea</a>';
    return;
  }
  const initialsOf = (n, u) => (n || u || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  const CAM = '<span class="av-badge"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span>';
  const avatarInner = () => (me.has_avatar && me.avatar_ts ? '<img src="/api/avatar?v=' + me.avatar_ts + '" alt="Profile picture"/>' : esc(initialsOf(me.name, me.username)));
  window.setAvatars = () => {
    ['hero-avatar', 'acct-avatar'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = avatarInner() + CAM;
    });
  };
  window.applyProfile = () => {
    const hn = $('#hero-name'); if (hn) hn.textContent = me.name || me.username;
    const hs = $('#hero-sub'); if (hs) hs.innerHTML = esc(me.email) + ' &middot; @' + esc(me.username);
    const tn = document.querySelector('.who .name'); if (tn) tn.textContent = me.name || me.username;
    const an = $('#acct-name'); if (an) an.textContent = me.name || me.username;
    const ae = $('#acct-email'); if (ae) ae.textContent = me.email;
    window.setAvatars();
  };
  app.innerHTML =
    '<div class="shell">' +
    '<header class="topbar"><a class="brand" href="https://mysweetpea.cc"><img src="https://mysweetpea.cc/logo.svg" alt="MySweetPea logo"/>MySweet<span class="mark">Pea</span></a>' +
    '<div class="who"><span class="name">' + esc(me.name || me.username) + '</span><button class="mini" id="pal-open" title="Command palette (Ctrl+K)" style="margin-right:10px">⌘K</button><a class="out" href="/auth/logout">Sign out</a></div></header>' +
    '<main class="grid"><div class="stats" id="stats" style="--i:0"></div>' +
    '<section class="card" id="sec-account" style="--i:1;grid-column:1/-1"><h3>Account</h3>' +
    '<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">' +
    '<div class="avatar" id="acct-avatar" onclick="openAvatarModal()" title="Change profile picture">' + avatarInner() + CAM + '</div>' +
    '<div style="flex:1;min-width:220px">' +
    '<div class="row"><div class="left"><b>Display name</b><span id="acct-name">' + esc(me.name || me.username) + '</span></div></div>' +
    '<div class="row"><div class="left"><b>Email</b><span id="acct-email">' + esc(me.email) + '</span></div></div>' +
    '<div class="row"><div class="left"><b>Username</b><span class="dim">@' + esc(me.username) + ' &middot; Usernames cannot be changed.</span></div></div>' +
    '</div>' +
    '<button class="mini primary" onclick="openProfileModal()">Edit profile</button>' +
    '</div></section>' +
    '<section id="sec-media" class="media-sec" style="--i:2"></section>' +
    '<section class="card" id="sec-services" style="--i:3"><h3>Services</h3><div class="svc-grid" id="svc-grid"></div></section>' +
    '<section class="card hero" style="--i:4"><div class="avatar" id="hero-avatar" onclick="openAvatarModal()" title="Change profile picture">' + avatarInner() + CAM + '</div><div>' +
    '<h2 id="hero-name">' + esc(me.name || me.username) + '</h2><p class="dim" id="hero-sub">' + esc(me.email) + ' &middot; @' + esc(me.username) + '</p>' +
    '<span class="pill ok">Account active</span></div></section>' +
    '<section class="card" id="sec-security" style="--i:5"><h3>Security</h3><div class="skel"></div></section>' +
    '<section class="card" id="sec-status" style="--i:6"><h3>Service status</h3><div class="skel"></div></section>' +
    '<section class="card" id="sec-sessions" style="--i:7"><h3>Your sessions</h3><div class="skel"></div></section>' +
    '<section class="card" id="sec-apps" style="--i:8"><h3>Connected apps</h3><div class="skel"></div></section>' +
    '</main><footer class="foot"><img src="https://mysweetpea.cc/logo.svg" alt=""/> <a href="https://mysweetpea.cc">mysweetpea.cc</a> &middot; homelab dashboard</footer></div>';

  // ===== PHASE 8: AVATAR MODAL (upload / remove / preview) =====
  window.openAvatarModal = async () => {
    let meta = { has: false, mime: '', bytes: 0, updated: 0 };
    try { const r = await fetch('/api/avatar/meta'); if (r.ok) meta = await r.json(); } catch (e) {}
    let b64 = '';
    modal('<h3>Profile picture</h3>' +
      '<p class="sub">PNG, JPEG or WebP &middot; up to 512KB. Shown next to your name across MySweetPea.</p>' +
      '<div style="display:flex;justify-content:center;margin-bottom:14px"><div class="avatar noact" style="width:96px;height:96px;font-size:1.9rem" id="av-prev">' + (meta.has && meta.updated ? '<img src="/api/avatar?v=' + meta.updated + '" alt=""/>' : esc(initialsOf(me.name, me.username))) + '</div></div>' +
      '<input type="file" id="av-file" accept="image/png,image/jpeg,image/webp,image/*" style="padding:9px 0"/>' +
      '<div class="merr" id="av-err"></div>' +
      '<div class="mrow">' + (meta.has ? '<button class="b-cancel" id="av-remove">Remove avatar</button>' : '') + '<button class="b-go" id="av-upload" disabled>Upload</button></div>');
    const prev = $('#av-prev'), file = $('#av-file'), up = $('#av-upload'), err = $('#av-err');
    file.onchange = () => {
      err.textContent = '';
      const f = file.files && file.files[0];
      if (!f) { b64 = ''; up.disabled = true; return; }
      if (f.size > 512 * 1024) { err.textContent = 'Image is too large (max 512KB).'; b64 = ''; up.disabled = true; return; }
      const rd = new FileReader();
      rd.onload = () => {
        const url = String(rd.result || '');
        b64 = url.split(',')[1] || '';
        prev.innerHTML = '<img src="' + url + '" alt=""/>';
        up.disabled = !b64;
      };
      rd.onerror = () => { err.textContent = 'Could not read that file.'; b64 = ''; up.disabled = true; };
      rd.readAsDataURL(f);
    };
    up.onclick = async () => {
      if (!b64) return;
      up.disabled = true;
      try {
        const r = await fetch('/api/avatar', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ data: b64 }) });
        const d = await r.json().catch(() => ({}));
        if (r.ok && d.ok) {
          me.has_avatar = true; me.avatar_ts = Date.now();
          window.setAvatars(); closeModal(); toast('Profile picture updated');
        } else {
          up.disabled = false;
          err.textContent = d.error || 'Upload failed.';
        }
      } catch (e) { up.disabled = false; err.textContent = 'Upload failed.'; }
    };
    const rm = $('#av-remove');
    if (rm) rm.onclick = async () => {
      rm.disabled = true;
      try {
        const r = await fetch('/api/avatar', { method: 'DELETE' });
        const d = await r.json().catch(() => ({}));
        if (r.ok && d.ok) {
          me.has_avatar = false; me.avatar_ts = 0;
          window.setAvatars(); closeModal(); toast('Profile picture removed');
        } else {
          rm.disabled = false;
          err.textContent = d.error || 'Could not remove avatar.';
        }
      } catch (e) { rm.disabled = false; err.textContent = 'Could not remove avatar.'; }
    };
  };

  // ===== PHASE 8: PROFILE EDIT MODAL (name + email, password step-up) =====
  window.openProfileModal = () => {
    modal('<h3>Edit profile</h3>' +
      '<p class="sub">Your name and email are used by every MySweetPea service. Changing them here updates your account everywhere (media, files, photos, sign-in). Your password is required.</p>' +
      '<label for="pf-name" style="display:none">Display name</label><input id="pf-name" type="text" maxlength="80" placeholder="Display name" value="' + esc(me.name || '') + '"/>' +
      '<label for="pf-email" style="display:none">Email address</label><input id="pf-email" type="email" maxlength="254" placeholder="Email address" value="' + esc(me.email || '') + '"/>' +
      '<label for="pf-pass" style="display:none">Current password</label><input id="pf-pass" type="password" placeholder="Current password" autocomplete="current-password"/>' +
      '<p class="sub" style="margin:-2px 0 10px">Want a new password instead? <a href="#" onclick="closeModal();ceremony(\'password\',\'Password change\');return false" style="color:var(--gold)">Change password instead</a></p>' +
      '<div class="merr" id="pf-err"></div>' +
      '<div class="mrow"><button class="b-cancel" onclick="closeModal()">Cancel</button><button class="b-go" id="pf-save">Save changes</button></div>');
    const err = $('#pf-err');
    $('#pf-save').onclick = async () => {
      const btn = $('#pf-save');
      const name = $('#pf-name').value.trim();
      const email = $('#pf-email').value.trim();
      const password = $('#pf-pass').value;
      err.textContent = '';
      if (!password) { err.textContent = 'Your password is required to save changes.'; return; }
      if (name.length < 1 || name.length > 80) { err.textContent = 'Name must be 1-80 characters.'; return; }
      if (email.length > 254 || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'Enter a valid email address.'; return; }
      btn.disabled = true;
      try {
        const r = await fetch('/api/profile/update', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: name, email: email, password: password }) });
        const d = await r.json().catch(() => ({}));
        if (r.ok && d.ok) {
          me.name = d.name || name;
          me.email = d.email || email;
          window.applyProfile();
          closeModal();
          toast('Profile updated — your account is changed everywhere');
        } else {
          btn.disabled = false;
          err.textContent = d.error || 'Update failed.';
        }
      } catch (e) { btn.disabled = false; err.textContent = 'Update failed.'; }
    };
  };

  // ===== PHASE 5: MEDIA ROWS (continue watching + recently added) =====
  (async () => {
    const host = $('#sec-media');
    if (!host) return;
    const JF_ITEM = 'https://media.mysweetpea.cc/web/index.html#!/item?id=';
    const grab = (u) => fetch(u).then(r => (r.ok ? r.json() : { items: [] })).catch(() => ({ items: [] }));
    const [cont, latest] = await Promise.all([grab('/api/media/continue'), grab('/api/media/latest')]);
    const posterCard = (it, o) => {
      const pct = Math.max(0, Math.min(100, Number(it.progressPct) || 0));
      let h = '<a class="mitem" href="' + JF_ITEM + encodeURIComponent(String(it.id ?? '')) + '" target="_blank" rel="noopener">';
      if (o.badge && it.type) h += '<span class="mtype">' + esc(it.type) + '</span>';
      h += '<img class="mposter" loading="lazy" alt="" src="' + esc(it.img) + '"/>';
      h += '<div class="mtitle">' + esc(it.name || '') + '</div>';
      if (it.seriesName) h += '<div class="msub">' + esc(it.seriesName) + '</div>';
      if (o.progress) h += '<div class="mprog"><i style="width:' + pct + '%"></i></div>';
      return h + '</a>';
    };
    let html = '';
    if ((cont.items || []).length) html += '<section class="card"><h3>Continue Watching</h3><div class="media-row">' + cont.items.map(it => posterCard(it, { progress: true })).join('') + '</div></section>';
    if ((latest.items || []).length) html += '<section class="card"><h3>Recently Added</h3><div class="media-row">' + latest.items.map(it => posterCard(it, { badge: true })).join('') + '</div></section>';
    if (!html) { host.remove(); return; }
    host.innerHTML = html;
  })();

  // ===== SERVICES LAUNCHER =====
  const SERVICES = [
    { name: 'Jellyfin',    url: 'https://media.mysweetpea.cc',   blurb: 'Movies & TV' },
    { name: 'Jellyseerr',  url: 'https://request.mysweetpea.cc', blurb: 'Request media' },
    { name: 'Nextcloud',   url: 'https://cloud.mysweetpea.cc',   blurb: 'Files & calendar' },
    { name: 'Immich',      url: 'https://photos.mysweetpea.cc',  blurb: 'Photo library' },
    { name: 'Vaultwarden', url: 'https://vault.mysweetpea.cc',   blurb: 'Passwords' },
    { name: 'Element',     url: 'https://chat.mysweetpea.cc',    blurb: 'Matrix chat' },
    { name: 'Open WebUI',  url: 'https://ai.mysweetpea.cc',      blurb: 'AI assistants' },
    { name: 'n8n',         url: 'https://n8n.mysweetpea.cc',     blurb: 'Automation' },
    { name: 'Gotify',      url: 'https://gotify.mysweetpea.cc',  blurb: 'Notifications' },
    { name: 'KoalaSync',   url: 'https://sync.mysweetpea.cc',    blurb: 'Jellyfin &harr; AniList sync' },
    { name: 'Uptime',      url: 'https://status.mysweetpea.cc',  blurb: 'Service status' },
    { name: 'Authentik',   url: 'https://auth.mysweetpea.cc',    blurb: 'SSO & account' },
  ];
  const SVC_COLORS = [
    { fg: 'var(--primary-bright)', bg: 'rgba(143,175,181,.14)' },
    { fg: 'var(--sage)',           bg: 'rgba(163,201,182,.15)' },
    { fg: 'var(--gold)',           bg: 'rgba(217,168,108,.15)' },
  ];
  const svcGrid = $('#svc-grid');
  if (svcGrid) svcGrid.innerHTML = SERVICES.map((s, i) => {
    const c = SVC_COLORS[i % SVC_COLORS.length];
    return '<a class="svc" href="' + s.url + '" target="_blank" rel="noopener noreferrer" title="' + esc(s.blurb) + '" aria-label="' + esc(s.name + ' — ' + s.blurb) + '">' +
      '<span class="svc-ico" style="color:' + c.fg + ';background:' + c.bg + '">' + esc(s.name[0].toUpperCase()) + '</span>' +
      '<span class="svc-name">' + esc(s.name) + '</span>' +
      '<span class="svc-blurb">' + esc(s.blurb) + '</span></a>';
  }).join('');

  // ===== SECURITY CENTER (checklist + actions) =====
  let devices = { totp: [], webauthn: [], static: [] };
  try { const r = await fetch('/api/devices'); if (r.ok) devices = await r.json(); } catch (e) {}
  const hasTotp = (devices.totp || []).length > 0;
  const hasWebauthn = (devices.webauthn || []).length > 0;
  const hasStatic = (devices.static || []).length > 0;
  const items = [
    { done: true,  label: 'Account created & active' },
    { done: hasTotp,    label: 'Authenticator app (TOTP)', act: hasTotp ? null : ['Set up', "ceremony('mfa','TOTP setup')"] },
    { done: hasWebauthn,label: 'Passkey / security key', act: hasWebauthn ? null : ['Add passkey', "ceremony('mfa','Passkey setup')"] },
    { done: hasStatic,  label: 'Recovery codes saved', act: hasStatic ? ['View info', "toast('Recovery codes were shown once at setup — regenerate via passkey/TOTP settings if lost')"] : ['Generate', "ceremony('mfa','Recovery codes')"] },
  ];
  const doneCount = items.filter(i => i.done).length;
  const pct = Math.round(doneCount / items.length * 100);
  const C = 2 * Math.PI * 24;
  const sec = $('#sec-security');
  sec.innerHTML = '<h3>Security</h3><div style="display:flex;gap:20px;align-items:center">' +
    '<svg class="ring" viewBox="0 0 54 54"><circle class="bg" cx="27" cy="27" r="24"/><circle class="fg" cx="27" cy="27" r="24" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - pct/100)) + '"/><text x="27" y="31">' + pct + '%</text></svg>' +
    '<div class="sec-checklist" style="flex:1">' +
    items.map(i => '<div class="check ' + (i.done ? 'done' : 'todo') + '"><span class="ico">' + (i.done ? '&#10003;' : '!') + '</span><span class="label">' + esc(i.label) + '</span>' +
      (i.act ? '<a class="act" onclick="' + i.act[1] + '">' + i.act[0] + '</a>' : '') + '</div>').join('') +
    '<div class="check todo" style="border:0"><span class="ico">&#9998;</span><span class="label">Change password</span><a class="act" onclick="ceremony(\'password\',\'Password change\')">Change</a></div>' +
    '</div></div>' +
    ((hasTotp || hasWebauthn) ? '<div style="margin-top:10px"><div class="row"><div class="left"><b>MFA devices</b><span class="dim">' + (devices.totp.length + devices.webauthn.length) + ' enrolled</span></div>' +
      '<button class="mini" onclick="manageDevices()">Manage</button></div></div>' : '');

  // device management modal
  window.manageDevices = async () => {
    const rows = []
      .concat(devices.totp.map(d => ({ kind: 'Authenticator app', name: d.name || 'TOTP', id: 'totp/' + d.pk })))
      .concat(devices.webauthn.map(d => ({ kind: 'Passkey', name: d.name || d.device_type?.name || 'key', id: 'webauthn/' + d.pk })));
    modal('<h3>MFA devices</h3><p class="sub">Remove devices you no longer use. Removing your last MFA device disables MFA.</p>' +
      rows.map(r => '<div class="row"><div class="left"><b>' + esc(r.name) + '</b><span class="dim">' + esc(r.kind) + '</span></div><button class="mini" onclick="delDevice(\'' + r.id + '\')">Remove</button></div>').join('') +
      '<div class="mrow"><button class="b-cancel" onclick="closeModal()">Close</button></div>');
  };
  window.delDevice = async (id) => {
    const r = await fetch('/api/devices/' + id, { method: 'DELETE' });
    if (r.ok) { toast('Device removed'); location.reload(); } else toast('Failed to remove');
  };

  // ===== STATUS =====
  fetch('/api/status').then(r => r.json()).then(d => {
    const el = $('#sec-status'); const mons = (d && d.monitors) || [];
    if (!mons.length) { el.innerHTML = '<h3>Service status</h3><p class="dim">No status data.</p>'; return; }
    el.innerHTML = '<h3>Service status</h3>' + mons.slice(0, 8).map(m => {
      const up = (m.uptime24h == null ? 100 : m.uptime24h) > 50;
      return '<div class="row"><div class="left"><span><span class="dot ' + (up ? 'ok' : 'down') + '"></span>' + esc(m.name) + '</span></div><span class="dim">' + Math.round(m.uptime24h || 0) + '%</span></div>';
    }).join('');
  }).catch(() => { $('#sec-status').innerHTML = '<h3>Service status</h3><p class="dim">Unavailable.</p>'; });

  // ===== SESSIONS =====
  fetch('/api/sessions').then(r => r.json()).then(d => {
    const el = $('#sec-sessions'); const list = (d && d.results) || [];
    if (!list.length) { el.innerHTML = '<h3>Your sessions</h3><p class="dim">No sessions found.</p>'; return; }
    el.innerHTML = '<h3>Your sessions</h3>' + list.slice(0, 6).map(s => {
      const dev = (s.current_session ? 'This device' : ((s.agent && (s.agent.device || s.agent.os)) || 'Session'));
      return '<div class="row"><div class="left"><b>' + esc(dev) + '</b><span class="dim">' + esc(s.last_ip || '') + '</span></div>' +
        (s.current_session ? '<span class="pill ok">current</span>' : '<button class="mini" data-sid="' + esc(s.uuid) + '">Revoke</button>') + '</div>';
    }).join('') + '<div class="row"><div class="left"><b>Sign out everywhere</b><span class="dim">End all other sessions</span></div><button class="mini" id="revoke-all">Revoke all</button></div>';
    el.querySelectorAll('button.mini[data-sid]').forEach(b => b.onclick = async () => {
      b.disabled = true; b.textContent = '…';
      await fetch('/api/sessions/' + b.dataset.sid, { method: 'DELETE' });
      const row = b.closest('.row'); row.style.opacity = .35; b.textContent = 'Revoked';
      toast('Session signed out', { action: () => location.reload(), label: 'Reload' });
    });
    const all = el.querySelector('#revoke-all');
    if (all) all.onclick = async () => {
      modal('<h3>Sign out everywhere?</h3><p class="sub">This ends every session except the one you are using now.</p><div class="mrow"><button class="b-cancel" onclick="closeModal()">Cancel</button><button class="b-go" id="confirm-all">Sign them out</button></div>');
      $('#confirm-all').onclick = async () => {
        closeModal();
        const others = list.filter(s => !s.current_session);
        for (const s of others) await fetch('/api/sessions/' + s.uuid, { method: 'DELETE' });
        toast('Signed out ' + others.length + ' session' + (others.length === 1 ? '' : 's'));
        setTimeout(() => location.reload(), 900);
      };
    };
  }).catch(() => { $('#sec-sessions').innerHTML = '<h3>Your sessions</h3><p class="dim">Unavailable.</p>'; });

  // ===== CONNECTED APPS =====
  fetch('/api/consents').then(r => r.json()).then(d => {
    const el = $('#sec-apps'); const list = (d && d.results) || [];
    if (!list.length) { el.innerHTML = '<h3>Connected apps</h3><p class="dim">No app consents yet.</p>'; return; }
    el.innerHTML = '<h3>Connected apps</h3>' + list.map(c => '<div class="row"><div class="left"><b>' + esc((c.application && c.application.name) || 'Application') + '</b></div><span class="dim">' + new Date(c.expires || Date.now()).toLocaleDateString() + '</span></div>').join('');
  }).catch(() => { $('#sec-apps').innerHTML = '<h3>Connected apps</h3><p class="dim">Unavailable.</p>'; });
})();
</script>
<script>
'use strict';
/* ================= PHASE 3: command palette + stat cards ================= */
(function () {
  const COMMANDS = [
    { t: 'Change password',            d: 'Authentik · user details',  run: () => ceremony('password', 'Password change') },
    { t: 'Set up TOTP',                d: 'Authentik · MFA',           run: () => ceremony('mfa', 'TOTP setup') },
    { t: 'Add a passkey',              d: 'Authentik · MFA',           run: () => ceremony('mfa', 'Passkey setup') },
    { t: 'Recovery codes',             d: 'Authentik · MFA',           run: () => ceremony('mfa', 'Recovery codes') },
    { t: 'Manage sessions',            d: 'Authentik · sessions',      run: () => { goSection('sec-sessions'); ceremony('sessions', 'Sessions'); } },
    { t: 'Sign out everywhere',        d: 'Revoke all other sessions', run: () => { goSection('sec-sessions'); revokeAll(); } },
    { t: 'Open Jellyfin',              d: 'media.mysweetpea.cc',       run: () => location.assign('https://media.mysweetpea.cc') },
    { t: 'Open Vaultwarden',           d: 'vault.mysweetpea.cc',       run: () => location.assign('https://vault.mysweetpea.cc') },
    { t: 'Open Nextcloud',             d: 'cloud.mysweetpea.cc',       run: () => location.assign('https://cloud.mysweetpea.cc') },
    { t: 'Open Photos (Immich)',       d: 'photos.mysweetpea.cc',      run: () => location.assign('https://photos.mysweetpea.cc') },
    { t: 'Open Notes (AFFiNE)',        d: 'notes.mysweetpea.cc',       run: () => location.assign('https://notes.mysweetpea.cc') },
      ];
  let sel = 0, filtered = COMMANDS.slice();
  const goSection = (id) => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };

  const pal = $('#pal'), input = $('#pal-q'), list = $('#pal-list');

  function render() {
    if (!filtered.length) { list.innerHTML = '<div class="pal-empty">No matching commands</div>'; return; }
    list.innerHTML = filtered.map((c, i) =>
      '<div class="pal-item' + (i === sel ? ' sel' : '') + '" data-i="' + i + '">' +
      '<b>' + esc(c.t) + '</b><span class="dim">' + esc(c.d) + '</span></div>').join('');
    list.querySelectorAll('.pal-item').forEach(el => {
      el.onclick = () => { close(); filtered[+el.dataset.i].run(); };
      el.onmouseenter = () => { sel = +el.dataset.i; render(); };
    });
    const s = list.querySelector('.sel'); if (s) s.scrollIntoView({ block: 'nearest' });
  }
  function open()  { pal.classList.add('open'); input.value = ''; filtered = COMMANDS.slice(); sel = 0; render(); setTimeout(() => input.focus(), 0); }
  function close() { pal.classList.remove('open'); input.blur(); }

  window.mspPalette = { open, close };

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    filtered = !q ? COMMANDS.slice() : COMMANDS.filter(c => (c.t + ' ' + c.d).toLowerCase().includes(q));
    sel = 0; render();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, filtered.length - 1); render(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); render(); }
    else if (e.key === 'Enter')  { e.preventDefault(); if (filtered[sel]) { close(); filtered[sel].run(); } }
    else if (e.key === 'Escape') { close(); }
  });
  pal.addEventListener('mousedown', (e) => { if (e.target === pal) close(); });

  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); pal.classList.contains('open') ? close() : open(); }
  });

  /* ---- stat cards (Jellyfin + Immich + sessions) ---- */
  function stat(n, l) { return '<div class="stat"><div class="n">' + n + '</div><div class="l">' + esc(l) + '</div></div>'; }
  function waitFor(sel) {
    return new Promise(resolve => {
      const el = document.querySelector(sel);
      if (el) return resolve(el);
      const t = setInterval(() => { const e2 = document.querySelector(sel); if (e2) { clearInterval(t); resolve(e2); } }, 120);
      setTimeout(() => { clearInterval(t); resolve(null); }, 15000);
    });
  }
  function dashRow() {
    return stat('—', 'Movies') + stat('—', 'Series') + stat('—', 'Photos') + stat('—', 'Active sessions');
  }
  (async () => {
    const el = await waitFor('#stats');
    if (!el) return;
    el.innerHTML = dashRow();
    try {
      const r = await fetch('/api/stats');
      const d = r.ok ? await r.json() : {};
      el.innerHTML =
        stat(d.movies ?? '—', 'Movies') +
        stat(d.series ?? '—', 'Series') +
        stat(d.photos ?? '—', 'Photos') +
        stat(d.sessions ?? '—', 'Active sessions');
    } catch (e) { /* keep dashes */ }
  })();

  /* palette button (topbar is built dynamically -> delegated) */
  document.addEventListener('click', (e) => {
    if (e.target && e.target.id === 'pal-open') { e.preventDefault(); window.mspPalette.open(); }
  });
})();
</script>
</body></html>
