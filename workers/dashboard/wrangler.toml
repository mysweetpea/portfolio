name = "dashboard"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Custom domain: dashboard.mysweetpea.cc (bound in CF dashboard)

[[kv_namespaces]]
binding = "SESSIONS"
id = "8fdd1c40796c413ebbd479c42c90ef44"

[vars]
# authentik 2026.8: authorize/token are GENERIC (not slug-scoped)
AUTH_ISSUER = "https://auth.mysweetpea.cc/application/o"
AUTH_BASE = "https://auth.mysweetpea.cc"
APP_URL = "https://dashboard.mysweetpea.cc"
JELLYFIN_USER_ID = "3d75456ef9c5438480195d731242133d"

# Secrets (set via `npx wrangler secret put ...`):
#   AUTHENTIK_CLIENT_ID
#   MSP_INTERNAL_HEADER

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Custom domain was serving index.html for /auth/* (assets-first short-circuit
# running before the script). Force ALL requests through the Worker script;
# the script proxies asset paths to ASSETS itself.
run_worker_first = true
